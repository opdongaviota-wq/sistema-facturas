# fly.toml - Configuración de Fly.io para Facturas Cloud
# Cambia "facturas-cloud-tuempresa" por un nombre único (solo minúsculas y guiones)
app = "facturas-cloud-tuempresa"
primary_region = "gru"   # São Paulo - más cercano a Chile

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/facturas.db"

# Volumen persistente para la base de datos SQLite
[mounts]
  source = "facturas_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
