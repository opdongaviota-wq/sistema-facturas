<title>Don Gaviota · Facturas y Pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spline+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0f2742; --navy-2:#1b3a5c; --teal:#0e7c7b; --teal-dk:#0a5e5d;
    --amber:#c97a16; --green:#2f8f57; --red:#c0392b;
    --bg:#eef2f6; --card:#ffffff; --border:#dde4ec;
    --text:#16263a; --muted:#5f7287; --muted-2:#8597a9;
    --shadow:0 1px 2px rgba(16,39,66,.06),0 4px 16px rgba(16,39,66,.06);
    --radius:12px; --side-w:236px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
  }
  h1,h2,h3{font-family:'Spline Sans','Inter',sans-serif;margin:0}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, #1b3a5c 0%, #0f2742 55%, #091c30 100%); padding:24px;}
  .login-card{width:100%; max-width:340px; background:var(--card); border-radius:18px;
    padding:28px 24px 24px; box-shadow:0 20px 60px rgba(0,0,0,.35); text-align:center;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
  .brand h1{font-size:18px;color:var(--navy);letter-spacing:-.2px}
  .login-card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 20px}
  .pin-display{display:flex;justify-content:center;gap:10px;margin-bottom:18px;height:16px}
  .pin-dot{width:13px;height:13px;border-radius:50%;background:#d6deea;transition:.15s}
  .pin-dot.on{background:var(--teal);transform:scale(1.05)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key{height:56px;border:1px solid var(--border);background:#fff;border-radius:12px;font-size:20px;
    font-weight:600;color:var(--navy);transition:.1s}
  .key:active{background:var(--bg);transform:scale(.97)}
  .key.alt{font-size:14px;font-weight:500;color:var(--muted)}
  .login-err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:12px}
  .roles-hint{margin-top:14px;font-size:11px;color:var(--muted-2);line-height:1.6}
  .rp-title{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 12px}
  .role-grid{display:flex;flex-direction:column;gap:10px}
  .role-card{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--border);border-radius:13px;
    background:#fff;text-align:left;width:100%;transition:.13s}
  .role-card:hover{border-color:var(--teal);background:#f6fbfb;transform:translateY(-1px)}
  .role-card .r-ico{width:42px;height:42px;border-radius:11px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .role-card .r-ico svg{width:22px;height:22px}
  .role-card .r-name{font-weight:700;color:var(--navy);font-size:14.5px}
  .role-card .r-desc{font-size:11.5px;color:var(--muted)}
  .role-card .r-arrow{margin-left:auto;color:var(--muted-2);font-size:22px;line-height:1}
  .pin-back{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:0;margin-bottom:6px}
  .pin-back:hover{color:var(--teal)}
  .pin-role{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:14px}
  .nav-item.locked{color:rgba(255,255,255,.30);cursor:not-allowed}
  .nav-item.locked:hover{background:transparent;color:rgba(255,255,255,.30)}
  .nav-item .lock{width:14px;height:14px;margin-left:auto;opacity:.7}

  /* ---------- App shell + sidebar ---------- */
  #app{display:flex;min-height:100vh}
  .sidebar{width:var(--side-w);background:var(--navy);color:#fff;display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s ease}
  .side-brand{padding:18px 18px 15px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .side-brand h1{font-size:15.5px;letter-spacing:-.2px}
  .side-brand small{display:block;color:rgba(255,255,255,.55);font-size:11px;font-weight:500;margin-top:1px}
  .side-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;border:none;background:transparent;
    color:rgba(255,255,255,.78);font-weight:600;font-size:13.5px;width:100%;text-align:left;transition:.12s}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:var(--teal);color:#fff}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .side-user{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
  .side-user .u-name{font-weight:600;font-size:13px}
  .side-user .u-role{color:rgba(255,255,255,.55);font-size:11.5px;text-transform:capitalize;margin-bottom:11px}
  .side-logout{display:flex;align-items:center;gap:9px;width:100%;justify-content:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;
    padding:9px;border-radius:9px;font-weight:600;font-size:13px;transition:.12s}
  .side-logout:hover{background:rgba(255,255,255,.14)}
  .side-logout svg{width:17px;height:17px}

  .backdrop{display:none}
  .content{flex:1;margin-left:var(--side-w);display:flex;flex-direction:column;min-width:0}
  .mobile-bar{display:none;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:12px 16px;
    padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:30}
  .mobile-bar .hamb{background:transparent;border:none;color:#fff;font-size:22px;line-height:1;padding:0 4px}
  .mobile-bar #mobTitle{font-weight:600;font-size:15px;font-family:'Spline Sans'}

  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);box-shadow:6px 0 30px rgba(0,0,0,.3)}
    body.nav-open .sidebar{transform:translateX(0)}
    .content{margin-left:0}
    .mobile-bar{display:flex}
    body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(9,28,48,.45);z-index:35}
  }

  main{flex:1;padding:18px;max-width:1180px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{font-size:19px;color:var(--navy);letter-spacing:-.3px}
  .page-head .spacer{flex:1}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .card+.card{margin-top:16px}
  .card-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px;
    display:flex;align-items:center;gap:8px}

  .btn{border:1px solid var(--border);background:#fff;color:var(--navy);padding:9px 15px;border-radius:9px;
    font-weight:600;font-size:13.5px;transition:.12s;display:inline-flex;align-items:center;gap:7px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:active{background:var(--teal-dk)}
  .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.danger{color:var(--red);border-color:#e6c3bf}
  .btn:disabled{opacity:.5;pointer-events:none}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
  .field label{font-size:12px;font-weight:600;color:var(--muted)}
  .field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;width:100%}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}

  .table-wrap{overflow-x:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:#f6f9fc;color:var(--muted);text-align:left;font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.4px;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap}

<script>
/* =================== CONFIG =================== */
const SUPABASE_URL = 'https://fvqdcprjucgfjlhphqun.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2cWRjcHJqdWNnZmpsaHBocXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMjYyNTgsImV4cCI6MjA5NjgwMjI1OH0.1iNROccL-D2AdZlYulJqnSXVmCXkiZm4QWl3g4d-TIk';
const REST = SUPABASE_URL + '/rest/v1';

const MODULES_BY_ROLE = {
  registrador:['facturas'],
  tesoreria:['dashboard','pagos','cheques'],

const ROLE_LABELS = { registrador:'Registrador', tesoreria:'Tesorería', supervisor:'Supervisor' };
const ROLE_DESC = { registrador:'Carga y consulta de facturas', tesoreria:'Pagos, cheques y caja', supervisor:'Acceso completo + ajustes' };
const ALL_MODULES = ['dashboard','facturas','pagos','cheques','ajustes'];

const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  dashboard:SVG('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),

};
const ROLE_ICONS = {
  registrador:SVG('<path d="M9 3.5h6a1 1 0 0 1 1 1v.5H8v-.5a1 1 0 0 1 1-1z"/><rect x="4" y="4.5" width="16" height="16" rx="2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/>'),
  tesoreria:SVG('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><line x1="6" y1="12" x2="6.01" y2="12"/><line x1="18" y1="12" x2="18.01" y2="12"/>'),
  supervisor:SVG('<path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>'),
};
const LOCK_SVG = `<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;

/* =================== STATE =================== */
let state = { role:null, user:null, facturas:[], alloc:[], pagos:[], cheques:[], usuarios:[], saldo:{}, activeMod:null };

/* =================== API =================== */
async function api(path, opts={}){
  const res = await fetch(REST+path, {
    ...opts,
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(!res.ok){ const t=await res.text(); throw new Error(t||('HTTP '+res.status)); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* =================== HELPERS =================== */
const CLP = n => '$'+(Math.round((+n||0))).toLocaleString('es-CL');
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}-${m}-${y}`; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg,type=''){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3000); }
const val = id => document.getElementById(id).value;

function normKey(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[._]/g,' ').replace(/\s+/g,' ').trim(); }
function parseMoney(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v;
  let s=String(v).replace(/[^\d.,-]/g,'').trim();
  if(!s) return 0;
  if(s.includes(',')){ s=s.replace(/\./g,'').replace(',','.'); }
  else { const parts=s.split('.'); if(parts.length>2 || (parts.length===2 && parts[1].length===3)) s=s.replace(/\./g,''); }
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  let s=String(v).trim();
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y='20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
}
const pad2 = x => String(x).padStart(2,'0');
const isoLocal = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function addDays(iso,n){ const d=new Date(String(iso).slice(0,10)+'T00:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function detectDateFormat(vals){
  let dayFirst=false, monthFirst=false;
  for(const s of vals){
    const m=s.match(/^(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})/);
    if(!m) continue;
    if(m[1].length===4) continue;        // ya viene yyyy-mm-dd
    if(+m[1]>12) dayFirst=true;           // 1er campo > 12 => es el día (d-m-y)
    if(+m[2]>12) monthFirst=true;         // 2do campo > 12 => es el día (m-d-y)
  }
  if(monthFirst && !dayFirst) return 'mdy';
  return 'dmy'; // por defecto día-mes-año (formato chileno)
}
function parseDateSmart(v, fmt){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return isoLocal(v);
  let s=String(v).trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if(m){
    let y=m[3]; if(y.length===2) y='20'+y;
    let dd, mm;
    if(fmt==='mdy'){ mm=+m[1]; dd=+m[2]; } else { dd=+m[1]; mm=+m[2]; }
    if(mm>12 && dd<=12){ const t=mm; mm=dd; dd=t; }  // red de seguridad
    if(mm>12 || dd>31) return null;                   // dato inválido -> nulo, no rompe el import
    return `${y}-${pad2(mm)}-${pad2(dd)}`;
  }
  const d=new Date(s); return isNaN(d)?null:isoLocal(d);
}
function saldoOf(f){ return Math.max(0, (+f.monto_total||0) - (state.saldo[f.id]||0)); }
function isNC(f){ const t=normKey(f.tipo_doc); return t.includes('nota de credito')||t.includes('nota credito')||t==='nc'; }
function saldoFirmado(f){ return (isNC(f)?-1:1)*saldoOf(f); }
function estadoOf(f){ const p=state.saldo[f.id]||0, t=+f.monto_total||0;
  if(p<=0.0001) return 'pendiente'; if(p<t-0.0001) return 'pagada_parcial'; return 'pagada'; }
function isVencida(f){ return !isNC(f) && f.fecha_vencimiento && f.fecha_vencimiento<todayISO() && saldoOf(f)>0.0001; }

/* =================== LOGIN =================== */
let pinBuf=''; let loginRole=null;
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','C','0','←'].forEach(k=>{
    const b=document.createElement('button');
    b.className='key'+((k==='C'||k==='←')?' alt':'');
    b.textContent=k; b.onclick=()=>pressKey(k); kp.appendChild(b);
  });
  renderPin();
}
function renderPin(){
  const d=document.getElementById('pinDisplay'); d.innerHTML='';
  for(let i=0;i<4;i++){ const s=document.createElement('div'); s.className='pin-dot'+(i<pinBuf.length?' on':''); d.appendChild(s); }
}
async function loadLoginRoles(){
  try{
    const users=await api('/usuarios?select=rol&activo=eq.true');
    const roles=[...new Set((users||[]).map(u=>u.rol))];
    renderRolePicker(roles);
  }catch(e){ renderRolePicker(['registrador','tesoreria','supervisor']); }
}
function renderRolePicker(roles){
  const order=['registrador','tesoreria','supervisor'];
  const sorted=order.filter(r=>roles.includes(r));
  const grid=document.getElementById('roleGrid');
  if(!sorted.length){ grid.innerHTML='<div class="preview-note" style="text-align:center">No hay usuarios activos.</div>'; return; }
  grid.innerHTML=sorted.map(r=>`<button class="role-card" onclick="pickRole('${r}')">
    <div class="r-ico">${ROLE_ICONS[r]}</div>
    <div><div class="r-name">${ROLE_LABELS[r]}</div><div class="r-desc">${ROLE_DESC[r]}</div></div>
    <div class="r-arrow">›</div></button>`).join('');
}
function pickRole(r){
  loginRole=r; pinBuf='';
  document.getElementById('loginRoles').classList.add('hidden');
  document.getElementById('loginPin').classList.remove('hidden');
  document.getElementById('pinRole').textContent='Rol: '+ROLE_LABELS[r];
  document.getElementById('loginErr').textContent='';
  renderPin();
}
function backToRoles(){
  loginRole=null; pinBuf='';
  document.getElementById('loginPin').classList.add('hidden');
  document.getElementById('loginRoles').classList.remove('hidden');
}
function pressKey(k){
  document.getElementById('loginErr').textContent='';
  if(k==='C'){ pinBuf=''; }
  else if(k==='←'){ pinBuf=pinBuf.slice(0,-1); }
  else if(pinBuf.length<4){ pinBuf+=k; }
  renderPin();
  if(pinBuf.length===4) setTimeout(tryLogin,120);
}
async function tryLogin(){
  const pin=pinBuf;
  document.getElementById('loginErr').textContent='Verificando…';
  try{
    const users=await api('/usuarios?select=*&pin=eq.'+encodeURIComponent(pin)+'&rol=eq.'+encodeURIComponent(loginRole)+'&activo=eq.true');
    if(users && users.length){
      state.user=users[0]; state.role=users[0].rol; pinBuf=''; document.getElementById('loginErr').textContent=''; startApp();
    } else { document.getElementById('loginErr').textContent='PIN incorrecto para '+ROLE_LABELS[loginRole]; pinBuf=''; renderPin(); }
  }catch(e){ document.getElementById('loginErr').textContent='Error de conexión'; pinBuf=''; renderPin(); }
}
function showLogin(){
  document.getElementById('app').classList.add('hidden');
  document.body.classList.remove('nav-open');
  document.getElementById('login').style.display='flex';
  document.getElementById('loginPin').classList.add('hidden');
  document.getElementById('loginRoles').classList.remove('hidden');
  loginRole=null; pinBuf=''; renderPin();
  loadLoginRoles();
}
function logout(){ state.role=null; state.user=null; showLogin(); }

/* =================== APP START / SHELL =================== */
async function startApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.remove('hidden');
  buildSidebar();
  await loadAll();
}
function buildSidebar(){
  const allowed=MODULES_BY_ROLE[state.role]||[];
  state.activeMod=allowed[0];
  const nav=document.getElementById('sideNav');
  nav.innerHTML=ALL_MODULES.map(m=>{
    const ok=allowed.includes(m);
    return `<button class="nav-item ${m===state.activeMod?'active':''} ${ok?'':'locked'}" data-mod="${m}" onclick="${ok?`navTo('${m}')`:'lockedMsg()'}">${ICONS[m]}<span>${MOD_LABELS[m]}</span>${ok?'':LOCK_SVG}</button>`;
  }).join('');
  document.getElementById('uName').textContent=(state.user&&state.user.nombre)||'Usuario';
  document.getElementById('uRole').textContent=ROLE_LABELS[state.role]||state.role;
  const mt=document.getElementById('mobTitle'); if(mt) mt.textContent=MOD_LABELS[state.activeMod];
}
function lockedMsg(){ toast('Tu rol no tiene acceso a este módulo','err'); }
function navTo(mod){
  state.activeMod=mod;

/* =================== DATA LOAD =================== */
async function loadAll(){
  document.getElementById('main').innerHTML='<div class="loading-screen"><span class="spin"></span> Cargando datos…</div>';
  try{
    const [facturas, alloc, cheques, pagos, usuarios] = await Promise.all([
      api('/facturas?select=*&order=fecha_emision.desc.nullslast,id.desc'),
      api('/pagos_facturas?select=*'),
      api('/cheques?select=*,pagos(rut,nombre)&order=fecha_canje.asc.nullslast'),
      api('/pagos?select=*&order=created_at.desc'),
      api('/usuarios?select=*&order=id.asc'),
    ]);
    state.facturas=facturas||[]; state.alloc=alloc||[]; state.cheques=cheques||[]; state.pagos=pagos||[]; state.usuarios=usuarios||[];
    state.saldo={};
    state.alloc.forEach(a=>{ state.saldo[a.factura_id]=(state.saldo[a.factura_id]||0)+(+a.monto_aplicado||0); });
    render();
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="card pad empty"><div class="ico">⚠️</div>
      <div class="t">No se pudieron cargar los datos</div><div>${esc(e.message)}</div>
      <div style="margin-top:14px"><button class="btn primary" onclick="loadAll()">Reintentar</button></div></div>`;
  }
}
async function loadUsuarios(){ try{ state.usuarios=await api('/usuarios?select=*&order=id.asc')||[]; }catch(e){} }

function render(){
  const m=document.getElementById('main');
  if(state.activeMod==='facturas') m.innerHTML=viewFacturas();
  else if(state.activeMod==='pagos') renderPagos();
  else if(state.activeMod==='cheques') m.innerHTML=viewCheques();
  else if(state.activeMod==='dashboard') m.innerHTML=viewDashboard();
  else if(state.activeMod==='ajustes') m.innerHTML=viewAjustes();
}

let facFilter={estado:'',q:'',imp:''};
let facSel=new Set();
function canCargar(){ return state.role==='registrador'||state.role==='supervisor'; }
function canDeleteFac(f){ return canCargar() && !(state.saldo[f.id]>0.0001); }
function diasPorVencer(f){
  if(!f.fecha_vencimiento) return null;
  const today=new Date(todayISO()+'T00:00:00');
  const venc=new Date(f.fecha_vencimiento.slice(0,10)+'T00:00:00');
  return Math.round((venc-today)/86400000);
}
function dueChip(f){
  if(saldoOf(f)<=0.0001) return '';
  const d=diasPorVencer(f); if(d===null) return '';
  let cls,txt;
  if(d<0){ cls='b-venc'; txt='vencida hace '+(-d)+'d'; }
  else if(d===0){ cls='b-venc'; txt='vence hoy'; }
  else if(d<=7){ cls='b-pend'; txt='en '+d+' días'; }
  else { cls='b-parc'; txt='en '+d+' días'; }
  return `<br><span class="badge ${cls}" style="margin-top:3px;display:inline-block">${txt}</span>`;
}
function facFiltered(){
  let list=state.facturas.filter(f=>{
    if(facFilter.estado==='pendientes' && saldoOf(f)<=0.0001) return false;
    if(facFilter.estado==='pagadas' && saldoOf(f)>0.0001) return false;
    if(facFilter.estado==='vencidas' && !isVencida(f)) return false;
    if(facFilter.imp){ const cut=new Date(Date.now()-(+facFilter.imp)*86400000).toISOString();
      if(!(f.created_at && f.created_at>=cut)) return false; }
    if(facFilter.q){ const q=facFilter.q.toLowerCase();
      if(!((f.nombre||'').toLowerCase().includes(q)||(f.rut||'').toLowerCase().includes(q)||(f.folio||'').toLowerCase().includes(q))) return false; }
    return true;
  });
  if(facFilter.imp) list=list.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return list;
}

function facBodyHTML(){
  const list=facFiltered();
  const ncols=canCargar()?8:7;
  if(!list.length) return `<tr><td colspan="${ncols}"><div class="empty"><div class="ico">📄</div><div class="t">Sin facturas</div><div>Importa un Excel o crea una factura.</div></div></td></tr>`;
  return list.map(f=>{
    const est=estadoOf(f), venc=isVencida(f);
    const badge = venc ? '<span class="badge b-venc">Vencida</span>'
      : est==='pagada' ? '<span class="badge b-pag">Pagada</span>'
      : est==='pagada_parcial' ? '<span class="badge b-parc">Parcial</span>'
      : '<span class="badge b-pend">Pendiente</span>';
    let chk='';
    if(canCargar()){
      chk = canDeleteFac(f)
        ? `<td><input type="checkbox" class="facchk" ${facSel.has(f.id)?'checked':''} onchange="toggleFacSel(${f.id},this.checked)"></td>`
        : `<td><span style="color:var(--muted-2)" title="Tiene pagos, no se puede eliminar">🔒</span></td>`;
    }
    return `<tr>
      ${chk}
      <td><b>${esc(f.folio)}</b><br><span style="color:var(--muted);font-size:11.5px">${esc(f.tipo_doc||'')}</span>${isNC(f)?' <span class="badge b-nc">NC</span>':''}${facFilter.imp&&f.created_at?`<br><span style="color:var(--teal);font-size:10.5px">▼ Importada ${fmtDate(f.created_at)}</span>`:''}</td>
      <td>${esc(f.nombre||'—')}<br><span style="color:var(--muted);font-size:11.5px">${esc(f.rut||'')}</span></td>
      <td>${fmtDate(f.fecha_emision)}</td>
      <td>${isNC(f)?'—':(f.fecha_vencimiento?fmtDate(f.fecha_vencimiento):'—')+dueChip(f)}</td>
      <td class="r money">${isNC(f)?'-'+CLP(f.monto_total):CLP(f.monto_total)}</td>
      <td class="r money" style="color:${isNC(f)?'var(--teal)':(saldoOf(f)>0?'var(--amber)':'var(--green)')}">${isNC(f)?'-'+CLP(saldoOf(f)):CLP(saldoOf(f))}</td>
      <td>${badge}</td>
    </tr>`;}).join('');
}
function toggleFacSel(id,on){ if(on) facSel.add(id); else facSel.delete(id); updateFacSelBar(); }
function toggleFacSelAll(on){
  facFiltered().forEach(f=>{ if(canDeleteFac(f)){ if(on) facSel.add(f.id); else facSel.delete(f.id); } });
  document.getElementById('facBody').innerHTML=facBodyHTML(); updateFacSelBar();
}
function updateFacSelBar(){

async function deleteFacturasByIds(ids){
  for(let i=0;i<ids.length;i+=150){
    const chunk=ids.slice(i,i+150);
    await api('/facturas?id=in.('+chunk.join(',')+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});
  }
}
async function deleteFacturas(){
  const ids=[...facSel]; if(!ids.length) return;
  if(!confirm(`¿Eliminar ${ids.length} documento(s)? Esta acción no se puede deshacer.`)) return;
  try{
    await deleteFacturasByIds(ids);
    toast(`${ids.length} documento(s) eliminado(s)`,'ok'); facSel.clear(); await loadAll();
  }catch(e){ toast('Error: '+e.message,'err'); }
}
/* ---- Panel de cargas (importaciones) ---- */
function lotesResumen(){
  const map={};
  state.facturas.forEach(f=>{
    const k=f.lote_carga||'__none__';
    if(!map[k]) map[k]={lote:f.lote_carga||null, n:0, total:0, conPago:0, ids:[], idsLibres:[]};
    map[k].n++; map[k].total+=(+f.monto_total||0); map[k].ids.push(f.id);
    if(state.saldo[f.id]>0.0001) map[k].conPago++; else map[k].idsLibres.push(f.id);
  });
  const arr=Object.values(map);
  arr.sort((a,b)=> (b.lote||'').localeCompare(a.lote||''));
  return arr;
}
function openCargas(){
  const host=document.getElementById('modalHost');
  const lotes=lotesResumen();
  const body = lotes.length ? lotes.map((l,i)=>{

    const libres=l.idsLibres.length;

      <div class="carga-info">

        <div class="carga-meta">${l.n} documentos · ${CLP(l.total)}${l.conPago?` · <span style="color:var(--amber)">${l.conPago} con pago (protegidos)</span>`:''}</div>

      <button class="btn sm danger" ${libres?'':'disabled'} onclick="deleteCargaIdx(${i})">Eliminar ${libres<l.n?`(${libres})`:''}</button>

    ${body}

  </div>`;
  host.scrollIntoView({behavior:'smooth',block:'center'});

async function deleteCargaIdx(i){
  const grp=lotesResumen()[i];
  if(!grp){ toast('Carga no encontrada','err'); return; }
  const ids=grp.idsLibres;
  if(!ids.length){ toast('No hay documentos eliminables en esta carga','err'); return; }
  const extra = grp.conPago ? ` (${grp.conPago} con pagos quedarán protegidos)` : '';
  if(!confirm(`¿Eliminar ${ids.length} documento(s) de esta carga?${extra}\nEsta acción no se puede deshacer.`)) return;
  try{
    await deleteFacturasByIds(ids);
    toast(`${ids.length} documento(s) eliminado(s)`,'ok'); facSel.clear(); await loadAll(); openCargas();
  }catch(e){ toast('Error: '+e.message,'err'); }
}

    <input id="xlsxInput" type="file" accept=".xlsx,.xls" class="hidden" onchange="handleXlsx(this.files[0])">

  </div>`;

const HEADER_MAP = {
  'tipo doc':'tipo_doc','tipo documento':'tipo_doc','tipodoc':'tipo_doc','tipo':'tipo_doc',
  'folio':'folio','nro':'folio','numero':'folio','n documento':'folio',
  'f emision':'fecha_emision','fecha emision':'fecha_emision','emision':'fecha_emision',
  'rut':'rut','rut proveedor':'rut',
  'nombre':'nombre','razon social':'nombre','proveedor':'nombre','nombre proveedor':'nombre',
  'total':'monto_total','monto':'monto_total','monto total':'monto_total','valor':'monto_total','total bruto':'monto_total',
  'vencimiento':'fecha_vencimiento','fecha vencimiento':'fecha_vencimiento','f vencimiento':'fecha_vencimiento','vence':'fecha_vencimiento',
};
function handleXlsx(file){
  if(!file) return;
  importFileName=file.name||'archivo.xlsx';
  if(typeof XLSX==='undefined'){ toast('No se cargó la librería de Excel (revisa tu conexión)','err'); return; }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
      if(!raw.length){ toast('La hoja está vacía','err'); return; }
      const mapping={};
      Object.keys(raw[0]).forEach(h=>{ const k=normKey(h); if(HEADER_MAP[k]) mapping[h]=HEADER_MAP[k]; });
      // Detectar orden de día/mes por columna de fecha
      const fmtByField={};
      ['fecha_emision','fecha_vencimiento'].forEach(f=>{
        const cols=Object.keys(mapping).filter(h=>mapping[h]===f);
        const vals=[]; raw.forEach(r=>cols.forEach(h=>{ const v=r[h]; if(typeof v==='string'&&v.trim()) vals.push(v.trim()); }));
        fmtByField[f]=detectDateFormat(vals);
      });
      importRows=raw.map(r=>{
        const o={tipo_doc:null,folio:null,fecha_emision:null,rut:null,nombre:null,monto_total:0,fecha_vencimiento:null};
        for(const h in mapping){ const field=mapping[h]; const v=r[h];
          if(field==='monto_total') o.monto_total=parseMoney(v);
          else if(field==='fecha_emision'||field==='fecha_vencimiento') o[field]=parseDateSmart(v,fmtByField[field]);
          else o[field]=(v===''||v==null)?null:String(v).trim();
        }
        return o;
      }).filter(o=>o.folio || o.monto_total>0);
      importRows.forEach(o=>{ if(!o.fecha_vencimiento) o.fecha_vencimiento=addDays(o.fecha_emision||todayISO(),30); });
      const fmtLabel = fmtByField.fecha_emision==='mdy' ? 'mes-día-año' : 'día-mes-año';
      renderImportPreview(Object.values(mapping), fmtLabel);
    }catch(err){ toast('Error leyendo el archivo: '+err.message,'err'); }
  };
  reader.readAsArrayBuffer(file);
}
function renderImportPreview(found, fmtLabel){
  const need=['folio','monto_total'];
  const missing=need.filter(n=>!found.includes(n));
  const host=document.getElementById('importPreview');
  if(!importRows.length){ host.innerHTML='<div class="preview-note">No se detectaron filas válidas.</div>'; return; }
  const head=`<div class="preview-note">Se detectaron <b>${importRows.length}</b> filas.
    ${missing.length?`<span class="mismatch">Faltan columnas: ${missing.join(', ')}.</span>`:'Mapeo de columnas correcto ✓'}
    ${fmtLabel?`Formato de fecha detectado: <b>${fmtLabel}</b>.`:''}
    Revisa que las fechas se vean bien antes de importar.</div>`;
  const rows=importRows.slice(0,8).map(r=>`<tr>
    <td>${esc(r.tipo_doc||'—')}</td><td><b>${esc(r.folio||'—')}</b></td><td>${r.fecha_emision?fmtDate(r.fecha_emision):'—'}</td>
    <td>${esc(r.rut||'—')}</td><td>${esc(r.nombre||'—')}</td><td class="r money">${CLP(r.monto_total)}</td>
    <td>${r.fecha_vencimiento?fmtDate(r.fecha_vencimiento):'—'}</td></tr>`).join('');
  host.innerHTML=head+`<div class="table-wrap"><table>
    <thead><tr><th>Tipo</th><th>Folio</th><th>Emisión</th><th>RUT</th><th>Nombre</th><th class="r">Total</th><th>Vence</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${importRows.length>8?`<div class="preview-note">… y ${importRows.length-8} filas más.</div>`:''}
    <button class="btn primary" ${missing.length?'disabled':''} onclick="doImport(this)">Importar ${importRows.length} facturas</button>`;
}
async function doImport(btn){
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Importando…';
  const now=new Date();
  const lote=`${importFileName} · ${pad2(now.getDate())}-${pad2(now.getMonth()+1)}-${now.getFullYear()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const recsBase=importRows.map(r=>({...r, estado:'pendiente'}));
  const postFacturas=recs=>api('/facturas?on_conflict=folio,rut',{ method:'POST',
    headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' }, body:JSON.stringify(recs) });
  const finish=()=>{ document.getElementById('modalHost').innerHTML=''; importRows=[]; loadAll(); };
  try{
    await postFacturas(recsBase.map(r=>({...r, lote_carga:lote})));
    toast(`Importación lista (${recsBase.length} filas, duplicados omitidos)`,'ok'); finish();
  }catch(e){
    if(/lote_carga/i.test(e.message)){
      // La columna aún no existe (o caché sin refrescar): importa sin etiqueta
      try{
        await postFacturas(recsBase);
        toast('Importado sin etiqueta de carga. Corre el SQL de lote_carga para agrupar cargas.','err'); finish();
      }catch(e2){ btn.disabled=false; btn.textContent='Reintentar importar'; toast('Error: '+e2.message,'err'); }
    } else { btn.disabled=false; btn.textContent='Reintentar importar'; toast('Error: '+e.message,'err'); }
  }
}

function payFacMatch(f){
  if(saldoOf(f)<=0.0001) return false;
  if(isNC(f)) return true;                 // Notas de crédito: siempre disponibles para aplicar
  const d=diasPorVencer(f);
  if(payEstado==='vencidas'){
    if(!(f.fecha_vencimiento && f.fecha_vencimiento<todayISO())) return false;
    if(payVentana){ if(d===null) return false; if(d < -(+payVentana)) return false; } // venció dentro de últimos N días
    return true;
  }
  if(payEstado==='porvencer'){
    if(f.fecha_vencimiento && f.fecha_vencimiento<todayISO()) return false;
    if(payVentana){ if(d===null) return false; if(d > (+payVentana)) return false; }  // vence dentro de próximos N días
    return true;
  }
  return true;
}

  const p=proveedoresConSaldo().find(x=>(x.rut||'sinrut|'+x.nombre)===pay.rut);

function clearProv(){ pay.rut=null; pay.items={}; pay.cheques=[]; provQuery=''; renderPagos(); }
function proveedoresConSaldo(){
  const map={};
  state.facturas.forEach(f=>{ if(!payFacMatch(f)) return;
    const key=f.rut||('sinrut|'+(f.nombre||''));
    if(!map[key]) map[key]={rut:f.rut,nombre:f.nombre,saldo:0,n:0,fac:0};
    map[key].saldo+=saldoFirmado(f); map[key].n++;
    if(!isNC(f)) map[key].fac+=saldoOf(f);
  });
  return Object.values(map).filter(p=>p.fac>0.0001).sort((a,b)=>b.saldo-a.saldo);
}
function selectProv(key){ pay.rut=key||null; pay.items={}; pay.cheques=[]; renderPagos(); }
function provFacturas(){
  return state.facturas.filter(f=>{ if(!payFacMatch(f)) return false;
    const key=f.rut||('sinrut|'+(f.nombre||'')); return key===pay.rut; });
}

function toggleFac(id,sal){ if(pay.items[id]!=null) delete pay.items[id]; else pay.items[id]=sal; renderPayBody(); }
function setMonto(id,v,sal){ let n=parseMoney(v); if(n>sal) n=sal; pay.items[id]=n;
  updatePayTotals(); renderChequeTotals(); }

function sumFacturasSel(){ return Object.entries(pay.items).reduce((s,[id,v])=>{ const f=state.facturas.find(x=>x.id==id); return (f&&!isNC(f))?s+(+v||0):s; },0); }
function sumNCSel(){ return Object.entries(pay.items).reduce((s,[id,v])=>{ const f=state.facturas.find(x=>x.id==id); return (f&&isNC(f))?s+(+v||0):s; },0); }
function sumItems(){ return sumFacturasSel()-sumNCSel(); }

    w.innerHTML = (pay.medio==='cheque' && sumItems()>0 && diff>1) ?

async function submitPago(btn){
  const items=Object.entries(pay.items).filter(([id,v])=>+v>0);
  if(!items.length){ toast('Selecciona al menos un documento con monto','err'); return; }
  const hayFactura=items.some(([id])=>{ const f=state.facturas.find(x=>x.id==id); return f && !isNC(f); });
  if(!hayFactura){ toast('Selecciona al menos una factura a pagar','err'); return; }
  const net=sumItems();
  if(net<0){ toast('Las notas de crédito superan las facturas seleccionadas. Reduce las NC o agrega facturas.','err'); return; }
  let chequesRec=[];
  if(pay.medio==='cheque' && net>0){
    chequesRec=pay.cheques.filter(c=>c.folio.trim()||parseMoney(c.monto)>0)
      .map(c=>({folio_cheque:c.folio.trim(),banco:c.banco.trim()||null,monto:parseMoney(c.monto),
        fecha_canje:c.canje||null,estado:'pendiente'}));
    if(!chequesRec.length){ toast('Agrega al menos un cheque con folio y monto','err'); return; }
    if(chequesRec.some(c=>!c.folio_cheque)){ toast('Cada cheque necesita folio','err'); return; }
    if(chequesRec.some(c=>!c.fecha_canje)){ toast('Cada cheque necesita fecha de canje','err'); return; }
    if(Math.abs(sumCheques()-net)>1){ toast('La suma de cheques debe igualar el neto a pagar','err'); return; }
  }
  const prov=provFacturas()[0]||{};
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Registrando…';
  try{
    const pago=(await api('/pagos',{method:'POST',headers:{Prefer:'return=representation'},
      body:JSON.stringify({ rut:prov.rut||null, nombre:prov.nombre||null, fecha_pago:(pay.medio==='cheque'?todayISO():(pay.fechaOp||todayISO())),
        medio_pago:pay.medio, monto_total:net, observacion:pay.obs.trim()||null })}))[0];
    const allocRec=items.map(([id,v])=>({pago_id:pago.id,factura_id:+id,monto_aplicado:+v}));
    await api('/pagos_facturas',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(allocRec)});
    if(chequesRec.length){ await api('/cheques',{method:'POST',headers:{Prefer:'return=minimal'},
      body:JSON.stringify(chequesRec.map(c=>({...c,pago_id:pago.id})))}); }
    await Promise.all(items.map(async([id,v])=>{
      const f=state.facturas.find(x=>x.id==id); const pagado=(state.saldo[id]||0)+(+v);
      const est = pagado>=(+f.monto_total)-0.0001 ? 'pagada' : 'pagada_parcial';
      await api('/facturas?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({estado:est})});
    }));
    toast('Pago registrado','ok');
    pay={rut:null,items:{},medio:'transferencia',cheques:[],obs:'',fechaOp:todayISO()};
    await loadAll(); navTo('pagos');
  }catch(e){ btn.disabled=false; btn.textContent='Registrar pago'; toast('Error: '+e.message,'err'); }
}

  </div>
  <div class="card pad">
    <div class="card-title">🌊 Flujo de caja proyectado · salidas por cheques</div>

    <div class="table-wrap"><table>
      <thead><tr><th>Fecha canje</th><th>Folio</th><th>Proveedor</th><th class="r">Monto</th></tr></thead>
      <tbody>${proxRows}</tbody></table></div>
  </div>`;
}

/* =================== AJUSTES · USUARIOS =================== */
let showPins=false;
function viewAjustes(){
  const users=(state.usuarios||[]).slice().sort((a,b)=>a.id-b.id);
  const activeCount=users.filter(u=>u.activo).length;
  const supActive=users.filter(u=>u.rol==='supervisor'&&u.activo);
  const full=users.length>=4;
  const rows=users.length?users.map(u=>{
    const isSelf=state.user&&u.id===state.user.id;
    const isLastSup=u.rol==='supervisor'&&u.activo&&supActive.length<=1;
    const canDelete=!isSelf&&!isLastSup;
    return `<tr>
      <td><b>${esc(u.nombre||'—')}</b>${isSelf?' <span class="badge b-parc">tú</span>':''}</td>
      <td>${ROLE_LABELS[u.rol]||esc(u.rol)}</td>
      <td class="num">${showPins?esc(u.pin):'••••'}</td>
      <td>${u.activo?'<span class="badge b-canj">Activo</span>':'<span class="badge b-pend">Inactivo</span>'}</td>
      <td class="r">${canDelete?`<button class="btn sm danger" onclick="deleteUser(${u.id})">Eliminar</button>`
        :`<span style="color:var(--muted-2);font-size:11.5px">${isSelf?'sesión actual':'único supervisor'}</span>`}</td>
    </tr>`;}).join('') : '<tr><td colspan="5"><div class="empty"><div class="ico">👥</div><div class="t">Sin usuarios</div></div></td></tr>';
  return `
  <div class="page-head"><h2>Ajustes · Usuarios</h2><div class="spacer"></div>
    <button class="btn ghost sm" onclick="showPins=!showPins;render()">${showPins?'Ocultar PINs':'Mostrar PINs'}</button></div>
  <div class="card pad">
    <div class="card-title">👥 Usuarios (${activeCount}/4)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nombre</th><th>Rol</th><th>PIN</th><th>Estado</th><th class="r">Acción</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>
  <div class="card pad">
    <div class="card-title">➕ Crear usuario</div>
    ${full?'<div class="preview-note mismatch">Llegaste al máximo de 4 usuarios. Elimina uno para crear otro.</div>':`
    <div class="grid3">
      <div class="field"><label>Nombre *</label><input id="nu_nombre" placeholder="Ej: María González"></div>
      <div class="field"><label>Rol *</label><select id="nu_rol">
        <option value="registrador">Registrador</option><option value="tesoreria">Tesorería</option><option value="supervisor">Supervisor</option></select></div>
      <div class="field"><label>PIN (4 dígitos) *</label><input id="nu_pin" inputmode="numeric" maxlength="4" placeholder="0000"></div>
    </div>
    <button class="btn primary" onclick="createUser(this)">Crear usuario</button>
    <div class="preview-note" style="margin-top:10px">El PIN es la clave de acceso de la persona. Debe ser único.</div>`}
  </div>`;
}
async function createUser(btn){
  const nombre=val('nu_nombre').trim(), rol=val('nu_rol'), pin=val('nu_pin').trim();
  if(!nombre){ toast('Falta el nombre','err'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('El PIN debe tener 4 dígitos','err'); return; }
  if((state.usuarios||[]).some(u=>u.pin===pin)){ toast('Ese PIN ya está en uso','err'); return; }
  if((state.usuarios||[]).length>=4){ toast('Máximo 4 usuarios','err'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Creando…';
  try{
    await api('/usuarios',{method:'POST',headers:{Prefer:'return=minimal'},
      body:JSON.stringify({nombre,rol,pin,activo:true})});
    toast('Usuario creado','ok'); await loadUsuarios(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Crear usuario'; toast('Error: '+e.message,'err'); }
}
async function deleteUser(id){
  const u=(state.usuarios||[]).find(x=>x.id===id); if(!u) return;
  if(!confirm(`¿Eliminar al usuario "${u.nombre}"? Esta acción no se puede deshacer.`)) return;
  try{
    await api('/usuarios?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    toast('Usuario eliminado','ok'); await loadUsuarios(); render();
  }catch(e){ toast('Error: '+e.message,'err'); }
}

/* =================== INIT =================== */
buildKeypad();
loadLoginRoles();
document.addEventListener('keydown',e=>{
  if(document.getElementById('login').style.display==='none') return;
  const lp=document.getElementById('loginPin');
  if(!lp || lp.classList.contains('hidden')) return;
  if(/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if(e.key==='Backspace') pressKey('←');
});
</script>
